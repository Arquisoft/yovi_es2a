openapi: 3.0.0
info:
  title: YOVI API (Usuarios + Motor de Juego)
  version: 1.0.0
  description: API completa para la gestión de usuarios, componente social y motor de juego.

tags:
  - name: Usuarios y Estadísticas
    description: Gestión de cuentas, autenticación, historial de partidas y clasificaciones.
  - name: Social y Grupos
    description: Gestión de la lista de amigos y grupos de juego.
  - name: Motor de Juego
    description: Microservicio en Rust. Lógica del tablero, movimientos y bots.

paths:
  /createuser:
    post:
      tags: [Usuarios y Estadísticas]
      summary: Crea un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "testuser" }
                password: { type: string, example: "mypassword" }
      responses:
        '201': { description: Usuario creado exitosamente }
        '400': { description: Falta el nombre de usuario o contraseña }
        '409': { description: El nombre de usuario ya está en uso }

  /login:
    post:
      tags: [Usuarios y Estadísticas]
      summary: Inicia sesión con un usuario existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "testuser" }
                password: { type: string, example: "mypassword" }
      responses:
        '200': { description: Inicio de sesión exitoso }
        '400': { description: Falta el nombre de usuario o contraseña }
        '401': { description: Usuario no encontrado o contraseña incorrecta }

  /savegame:
    post:
      tags: [Usuarios y Estadísticas]
      summary: Guarda el resultado de una partida terminada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, rival, resultado]
              properties:
                username: { type: string }
                rival: { type: string }
                resultado: { type: string, enum: ['1', '2'] }
                size: { type: integer }
      responses:
        '201': { description: Partida guardada exitosamente }

  /history/{username}:
    get:
      tags: [Usuarios y Estadísticas]
      summary: Devuelve el historial de partidas de un usuario
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Historial de partidas recuperado }

  /stats/{username}:
    get:
      tags: [Usuarios y Estadísticas]
      summary: Devuelve las estadísticas agregadas de un usuario
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Estadísticas calculadas exitosamente }

  /ranking:
    get:
      tags: [Usuarios y Estadísticas]
      summary: Devuelve el top 10 de jugadores por puntuación
      responses:
        '200': { description: Ranking recuperado exitosamente }

  /user/{username}:
    get:
      tags: [Usuarios y Estadísticas]
      summary: Devuelve los datos públicos de un usuario
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Datos del usuario recuperados }

  /addfriend/{friendUsername}:
    post:
      tags: [Social y Grupos]
      summary: Añade a un usuario como amigo
      parameters:
        - name: friendUsername
          in: path
          required: true
          schema: { type: string }
        - name: X-User
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Amigo añadido exitosamente }

  /removefriend/{friendUsername}:
    delete:
      tags: [Social y Grupos]
      summary: Elimina a un amigo de la lista
      parameters:
        - name: friendUsername
          in: path
          required: true
          schema: { type: string }
        - name: X-User
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Amigo eliminado exitosamente }

  /friends/{username}:
    get:
      tags: [Social y Grupos]
      summary: Devuelve la lista de amigos de un usuario
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lista de amigos recuperada }

  /groups:
    get:
      tags: [Social y Grupos]
      summary: Devuelve todos los grupos públicos disponibles
      responses:
        '200': { description: Grupos recuperados }

  /creategroup:
    post:
      tags: [Social y Grupos]
      summary: Crea un nuevo grupo de juego
      parameters:
        - name: X-User
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200': { description: Grupo creado exitosamente }

  /group/{groupId}:
    get:
      tags: [Social y Grupos]
      summary: Devuelve los detalles de un grupo específico
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Detalles del grupo recuperados }

  /joingroup/{groupId}:
    post:
      tags: [Social y Grupos]
      summary: Une al usuario a un grupo público
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
        - name: X-User
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Usuario unido al grupo exitosamente }

  /leavegroup/{groupId}:
    delete:
      tags: [Social y Grupos]
      summary: El usuario abandona un grupo
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
        - name: X-User
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Grupo abandonado exitosamente }

  /mygroups:
    get:
      tags: [Social y Grupos]
      summary: Devuelve los grupos a los que pertenece el usuario
      parameters:
        - name: X-User
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Grupos del usuario recuperados }

  /game/new:
    post:
      tags: [Motor de Juego]
      summary: Crea una nueva partida en el motor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                size: { type: integer }
                mode: { type: string }
                bot: { type: string }
      responses:
        '201': { description: Partida creada y UUID generado }
          
  /game/{gameId}:
    get:
      tags: [Motor de Juego]
      summary: Obtiene el estado actual de una partida
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Estado del tablero devuelto }
          
  /game/{gameId}/move:
    post:
      tags: [Motor de Juego]
      summary: Realiza un movimiento o acción en el tablero
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player: { type: string }
                action: { type: string, enum: ['place', 'resign', 'timeout'] }
                cell_index: { type: integer, nullable: true }
      responses:
        '200': { description: Movimiento aceptado y nuevo estado generado }
          
  /play:
    get:
      tags: [Motor de Juego]
      summary: API Pública para que los Bots externos (YEN) jueguen
      parameters:
        - name: position
          in: query
          required: true
          schema: { type: string }
        - name: bot_id
          in: query
          schema: { type: string }
      responses:
        '200': { description: Devuelve la coordenada del siguiente movimiento }